[package]
name = "forgeone-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
forgeone-context = { path = "../forgeone-context" }
forgeone-policy = { path = "../forgeone-policy" }
forgeone-session = { path = "../forgeone-session" }
forgeone-trace = { path = "../forgeone-trace" }
forgeone-tools = { path = "../forgeone-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
futures-util = "0.3"

[dev-dependencies]
axum = "0.7"

[lib]
path = "src/lib.rs"
