name: CI

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --verbose

  frontend-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/forgeone-desktop/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: apps/forgeone-desktop

      - name: Type check
        run: npx tsc -b
        working-directory: apps/forgeone-desktop

      - name: Lint
        run: npm run lint
        working-directory: apps/forgeone-desktop

      - name: Build frontend
        run: npm run build
        working-directory: apps/forgeone-desktop
